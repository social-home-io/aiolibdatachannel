name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Stress tests run nightly so we catch slow regressions without
  # paying the 2-minute cost on every PR.
  schedule:
    - cron: "0 5 * * *"
  # Manual dispatch — lets a reviewer kick off the stress matrix on a
  # PR branch without having to add the `stress` label.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio ruff mypy
      - name: ruff
        run: |
          ruff check aiolibdatachannel tests
          ruff format --check aiolibdatachannel tests
      - name: mypy
        run: mypy aiolibdatachannel

  tests-pure:
    name: Pure-Python tests (fake native, no C++ toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No submodules — we don't need libdatachannel sources for the
        # pure path. The fake in tests/_fake_native.py stands in for
        # the compiled extension.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: Run Python-only tests
        # AIOLIB_REQUIRE_NATIVE is unset → conftest injects the fake
        # ``aiolibdatachannel._native`` module into sys.modules and
        # deselects @pytest.mark.native tests. PYTHONPATH=. puts the
        # in-tree ``aiolibdatachannel/`` package on the import path —
        # we never pip-install (would require a C++ toolchain), we
        # just let Python resolve the package from the source tree.
        env:
          PYTHONPATH: "."
        run: pytest -q -m "not native"

  tests-native:
    name: Full tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows isn't covered — bundling OpenSSL DLLs + DLL search-path
        # setup is a separate investment and we don't currently publish
        # Windows wheels either.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3
      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full test suite (smoke, no stress)
        env:
          AIOLIB_REQUIRE_NATIVE: "1"
        run: pytest -v

  tests-stress:
    # Long-running soak tests: 10k-message loopback + 100 PC lifecycles.
    # Gated on the `stress` label + scheduled daily so we don't pay 2
    # minutes on every PR, but catch regressions before release.
    name: Stress tests (${{ matrix.os }})
    if: >-
      contains(github.event.pull_request.labels.*.name, 'stress')
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run stress suite
        env:
          AIOLIB_REQUIRE_NATIVE: "1"
          AIOLIB_STRESS: "1"
        # pytest -m stress selects only the stress-marked tests. Timeout
        # caps at 10 minutes in case a hang sneaks back in.
        timeout-minutes: 10
        run: pytest -v -m stress
