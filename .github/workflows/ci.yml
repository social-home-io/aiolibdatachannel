name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio ruff mypy
      - name: ruff
        run: |
          ruff check aiolibdatachannel tests
          ruff format --check aiolibdatachannel tests
      - name: mypy
        run: mypy aiolibdatachannel

  tests-pure:
    name: Pure-Python tests (fake native, no C++ toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No submodules — we don't need libdatachannel sources for the
        # pure path. The fake in tests/_fake_native.py stands in for
        # the compiled extension.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: Run Python-only tests
        # AIOLIB_REQUIRE_NATIVE is unset → conftest injects the fake
        # ``aiolibdatachannel._native`` module into sys.modules and
        # deselects @pytest.mark.native tests. The sys.path hack here
        # works because we never build/install the package; we import
        # the in-tree ``aiolibdatachannel/`` directly, which is pure
        # Python once the fake takes over for _native.
        run: pytest -q -m "not native"

  tests-native:
    name: Full tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows isn't covered — bundling OpenSSL DLLs + DLL search-path
        # setup is a separate investment and we don't currently publish
        # Windows wheels either.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3
      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full test suite
        env:
          AIOLIB_REQUIRE_NATIVE: "1"
        run: pytest -v
