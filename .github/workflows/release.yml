name: Release

on:
  # Fires on any git tag push — we use CalVer (e.g. 2026.4.21), but this
  # also covers plain v* tags or anything else someone pushes. The
  # setuptools-scm integration in pyproject.toml reads whatever tag you
  # pushed and bakes it into the built sdist.
  push:
    tags: ["*"]
  workflow_dispatch:

# We publish *source* distributions only — no binary wheels. Reasons:
#
# * libdatachannel statically links OpenSSL into the wheel via auditwheel
#   (renamed soname so the dynamic linker doesn't conflict). End-user
#   CPython processes still load their own OpenSSL globally via the
#   ``_ssl`` / ``hashlib`` modules, and OpenSSL's process-global state
#   (PRNG, error queues, locks, FIPS provider machinery) is not
#   isolated by soname renaming. On CPython 3.14 the two OpenSSLs
#   collide hard enough to segfault inside ``rtcCreatePeerConnection``
#   on first use. Sidestepping the cohabitation by shipping a source
#   build means each user's libdatachannel links the *same* OpenSSL
#   their Python already loaded — no two-version process.
# * Source builds are slower for the user but make the surface honest:
#   the user sees the C++ toolchain requirements in the install error
#   instead of a wheel that imports cleanly and segfaults later.
#
# Users still install with ``pip install aiolibdatachannel`` — pip will
# pull the sdist, build it locally against their system OpenSSL +
# libdatachannel deps, and cache the resulting wheel. See README for
# the system prerequisites (cmake, ninja, a C++ toolchain, libssl-dev /
# openssl@3).

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm needs the full git history to resolve the
          # current tag into a version string.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        # Forwarding the tag name as SETUPTOOLS_SCM_PRETEND_VERSION means
        # `python -m build` doesn't have to shell out to git to discover
        # the version. Leaving it unset lets setuptools-scm fall back to
        # the dev-stamped version on workflow_dispatch runs.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/aiolibdatachannel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
