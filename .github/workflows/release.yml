name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 + arm64.
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          # macOS amd64 + arm64.
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64
          # Windows amd64 + arm64. windows-11-arm is a native ARM64 runner
          # which avoids the reliability issues of cross-compiling.
          - os: windows-latest
            arch: AMD64
          - os: windows-11-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # Our wheel is Python-version-independent (py3-none-<platform>)
          # because cffi dispatches to the bundled shared library at
          # runtime. requires-python = ">=3.12" in pyproject.toml gates
          # installation to 3.12+. cibuildwheel still needs a concrete
          # Python to drive the build, so we pick 3.12 and emit one wheel
          # per (os, arch).
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: "yum install -y openssl-devel"
          CIBW_BEFORE_ALL_MACOS: "brew install openssl@3"
          CIBW_ENVIRONMENT_MACOS: >-
            OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
            MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_REQUIRES: "pytest pytest-asyncio"
          CIBW_TEST_COMMAND: "pytest {project}/tests -q"
          # Skip tests on macOS/Windows runners (no loopback UDP perms
          # guaranteed in hosted runners). Linux runs the full suite.
          CIBW_TEST_SKIP: "*-macosx_* *-win_*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/aiolibdatachannel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
