name: Release

on:
  # Fires on any git tag push — we use CalVer (e.g. 2026.4.21), but this
  # also covers plain v* tags or anything else someone pushes. The
  # setuptools-scm integration in pyproject.toml reads whatever tag you
  # pushed and bakes it into the built wheel.
  push:
    tags: ["*"]
  workflow_dispatch:

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm needs the full git history to resolve the
          # current tag into a version string.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        # Forwarding the tag name as SETUPTOOLS_SCM_PRETEND_VERSION means
        # `python -m build` doesn't have to shell out to git to discover
        # the version. Leaving it unset lets setuptools-scm fall back to
        # the dev-stamped version on workflow_dispatch runs.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 + arm64.
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          # macOS arm64 only. Intel Mac (x86_64) is skipped — modern
          # Macs are all Apple Silicon. The deployment target is 14.0
          # because that's the minimum macOS the Homebrew openssl@3
          # bottle ships with; delocate refuses to downgrade it.
          - os: macos-14
            arch: arm64
          # Windows support is deferred — the bundled libdatachannel
          # dynamically links OpenSSL's DLLs and we haven't wired up the
          # delvewheel / os.add_dll_directory dance needed to make that
          # work on end-user machines.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm needs the full git history to resolve the
          # current tag into a version string.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cibuildwheel v3 added the runtime images for CPython 3.14 + the
      # AlmaLinux 9 (manylinux_2_34) base used below. v2.21 ships
      # neither.
      - uses: pypa/cibuildwheel@v3.4
        env:
          # cibuildwheel tars the project and runs pip inside a manylinux
          # container — git history isn't available there, so we forward
          # the tag name directly and ask setuptools-scm to use it.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CIBW_ENVIRONMENT_PASS_LINUX: "SETUPTOOLS_SCM_PRETEND_VERSION"
          CIBW_ARCHS: ${{ matrix.arch }}
          # Per-Python-version wheels (cp312 / cp313 / cp314) instead of
          # the previous ABI3 single-wheel layout. The ABI3 wheel
          # statically bundled OpenSSL via auditwheel and the bundled
          # copy collided with CPython's own ``_ssl`` OpenSSL on 3.14
          # (``std::vector<std::string>::~vector()`` segfault on first
          # ``PeerConnection`` use). Per-version wheels mean each build
          # links against the matching interpreter's OpenSSL ABI; the
          # wheel still bundles OpenSSL via auditwheel for now so we
          # can confirm the per-version layout alone is enough — if
          # cp314 still segfaults inside cibuildwheel's test step, the
          # follow-up move is to teach auditwheel to *not* bundle
          # ``libssl`` / ``libcrypto`` and depend on the host's
          # OpenSSL 3 instead.
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          # AlmaLinux 9 (manylinux_2_34) ships OpenSSL 3.x. The previous
          # manylinux_2_28 base baked in OpenSSL 1.1.1, which auditwheel
          # bundled into the wheel; on hosts that also load the system
          # OpenSSL 3 (Python's ``_ssl`` does, transitively), the
          # libdatachannel static link would crash on the first
          # ``PeerConnection`` constructor under CPython 3.14. Match the
          # bundled OpenSSL to what modern hosts already run.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          CIBW_BEFORE_ALL_LINUX: "yum install -y openssl-devel"
          CIBW_BEFORE_ALL_MACOS: "brew install openssl@3"
          CIBW_ENVIRONMENT_MACOS: >-
            OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
            MACOSX_DEPLOYMENT_TARGET=14.0
          CIBW_TEST_REQUIRES: "pytest pytest-asyncio pytest-timeout"
          # Smoke suite only — stress tests are skipped at this layer
          # because they reliably hang inside cibuildwheel's
          # manylinux docker container (the same tests complete in
          # ~70 s natively on the same host runner). Suspected
          # container-specific SCTP/thread interaction we don't want
          # to debug under release-time pressure. Stress coverage
          # still runs via the CI workflow's ``tests-stress`` job
          # (nightly cron + on-demand via label/workflow_dispatch) on
          # the host runner without docker, so regressions are caught
          # before the next release cut — just not on the release tag
          # itself.
          #
          # Two timeouts in series so a hung test doesn't burn the
          # full 6-hour GitHub Actions ceiling:
          #
          # 1. ``pytest --timeout=60 --timeout-method=signal`` — fires
          #    SIGALRM at the test process. Signal mode is used (not
          #    thread mode) because the suspected hang is in
          #    ``test_shutdown_hygiene.py``'s ``subprocess.communicate()``
          #    call: that releases the GIL and blocks in C, so the
          #    thread-mode watchdog's ``KeyboardInterrupt`` only fires
          #    after the syscall returns. SIGALRM interrupts the
          #    syscall directly, so the timeout actually triggers.
          #    pytest-timeout dumps frames + the test name on fire,
          #    so we get a name to investigate next time.
          # 2. Shell-level ``timeout 600`` (10 min) — belt-and-braces
          #    hard kill. If pytest-timeout still doesn't fire (e.g.
          #    process is stuck in a kernel call signals can't
          #    interrupt), the OS kills the process at 10 min total.
          #    ``--kill-after=15`` upgrades to SIGKILL 15s later in
          #    case the SIGTERM isn't picked up.
          #
          # Loopback / shutdown-hygiene tests finish in <2 s on bare
          # metal; the per-test 60 s + the per-job 10 min are both
          # well over the natural ceiling so a real test never trips
          # them.
          CIBW_TEST_COMMAND: >-
            AIOLIB_REQUIRE_NATIVE=1
            timeout --kill-after=15 600
            pytest {project}/tests -v -m "not stress"
            --timeout=60 --timeout-method=signal
          # macOS runners can't get reliable loopback UDP permissions
          # for the ICE-gathering tests, so test only on Linux. Linux
          # tests now include cp314 — the whole point of this layout
          # is to find out whether per-version wheels make 3.14 stable.
          CIBW_TEST_SKIP: "*-macosx_*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/aiolibdatachannel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
