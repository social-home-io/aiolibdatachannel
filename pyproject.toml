[build-system]
# setuptools-scm is pinned to <9 because v9 reorganised its
# Configuration API (moved to the vcs_versioning package) and
# scikit-build-core's built-in setuptools_scm provider doesn't speak the
# new shape yet. Revisit when scikit-build-core adds v9 support.
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8,<9",
    "nanobind>=2.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "aiolibdatachannel"
# Version is derived from the git tag by setuptools-scm at build time.
# CalVer tags (e.g. 2026.4.21) flow straight through — see
# [tool.setuptools_scm] below and the release workflow's tag trigger.
dynamic = ["version"]
description = "asyncio-friendly Python wrapper for libdatachannel (WebRTC Data Channels)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MPL-2.0" }
authors = [{ name = "Pascal Vizeli", email = "pascal.vizeli@nabucasa.com" }]
keywords = ["webrtc", "datachannel", "libdatachannel", "asyncio", "p2p"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/social-home-io/aiolibdatachannel"
Issues = "https://github.com/social-home-io/aiolibdatachannel/issues"
"libdatachannel" = "https://github.com/paullouisageneau/libdatachannel"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.24"
ninja.make-fallback = true
# Use nanobind's stable ABI (Py_LIMITED_API) so one compiled wheel covers
# all CPython 3.12+ — same practical shape as the old cffi wheel, minus
# the runtime cffi dependency.
wheel.py-api = "cp312"
wheel.packages = ["aiolibdatachannel"]

# Rebuild editable installs on-demand when sources change.
editable.mode = "redirect"
editable.rebuild = true

# Pull the version from the git tag at build time.
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# Ship the libdatachannel sources in the sdist, but strip unused subdirs.
sdist.include = [
    "vendor/libdatachannel/CMakeLists.txt",
    "vendor/libdatachannel/LICENSE",
    "vendor/libdatachannel/cmake/**",
    "vendor/libdatachannel/include/**",
    "vendor/libdatachannel/src/**",
    "vendor/libdatachannel/deps/**",
]
sdist.exclude = [
    "vendor/libdatachannel/.git",
    "vendor/libdatachannel/.github",
    "vendor/libdatachannel/examples",
    "vendor/libdatachannel/test",
    "vendor/libdatachannel/pages",
    "build",
    "dist",
    ".venv",
]

[tool.setuptools_scm]
# Write the resolved version into a file inside the package so it's
# discoverable after install. Unversioned commits get the standard
# ``<tag>.post<n>.dev<m>+g<sha>`` devstamp from setuptools-scm.
version_file = "aiolibdatachannel/_version.py"
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]
# _version.py is generated by setuptools-scm; don't lint it.
extend-exclude = ["aiolibdatachannel/_version.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ASYNC",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["."]
packages = ["aiolibdatachannel"]

# The compiled nanobind extension doesn't ship type stubs.
[[tool.mypy.overrides]]
module = ["aiolibdatachannel._native"]
ignore_missing_imports = true

# Auto-generated by setuptools-scm; don't type-check its stubs.
[[tool.mypy.overrides]]
module = "aiolibdatachannel._version"
ignore_errors = true

# The dispatcher glue does dynamic dict lookups keyed by ints; let it be.
[[tool.mypy.overrides]]
module = "aiolibdatachannel._core"
disable_error_code = ["misc", "no-any-return"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "native: test requires the compiled aiolibdatachannel._native extension (real libdatachannel handshake, not the in-memory fake)",
]
